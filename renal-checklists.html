<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 5 Structure Checklists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#060B1A;--navy2:#1E3D4C;--tint:#EDF1F3;--maroon:#7A2A22;--maroon-d:#5E1F19;--page:#FAFAF9;--line:#C9CED6;--muted:#3B4558}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--navy);font-family:'DM Sans',Arial,sans-serif;font-style:normal;font-size:18px;line-height:1.4}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:12px 16px;z-index:10}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
header :focus-visible{outline-color:#fff}
header{background:var(--navy);color:#fff;padding:26px 20px 22px}
.wrap{max-width:860px;margin:0 auto}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#D9B66A}
h1{font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:8px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tab{font:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;min-height:44px;padding:11px 16px;border-radius:999px;border:1px solid #8A93A8;background:transparent;color:#fff;cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:var(--navy);border-color:#fff}
main{padding:22px 20px 40px}
h2{font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:800;font-size:26px;margin:0}
.how{margin:6px 0 0;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
.count{font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:800;font-size:20px;color:var(--maroon);margin-right:auto}
.btn{font:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;min-height:44px;padding:10px 18px;border-radius:8px;border:2px solid transparent;color:#fff;cursor:pointer}
.b-navy{background:var(--navy)}
.b-maroon{background:var(--maroon)}
.b-maroon:hover{background:var(--maroon-d)}
ol{list-style:none;margin:0;padding:0;counter-reset:n}
li{counter-increment:n;margin-bottom:8px}
li label{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
li label::before{content:counter(n);font-family:'Plus Jakarta Sans',Arial,sans-serif;font-weight:800;color:var(--maroon);min-width:1.6em}
li input{width:24px;height:24px;accent-color:var(--navy2);flex:none}
li input:checked + span{font-weight:700}
li.done label{background:var(--tint);border:2px solid var(--navy2)}
.group{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--maroon);margin:18px 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{
  header{background:#fff;color:#000;padding:0 0 8px}.eyebrow{color:#000}.tabs,.top .btn,.skip{display:none}
  body{background:#fff;color:#000;font-size:12pt}
  .panel{display:block !important;break-inside:avoid;margin-bottom:18px}
  li label{border:0;box-shadow:none;background:#fff !important;min-height:0;padding:3px 0}
  li.done label{border:0}li label::before,.count,.group{color:#000}
}

/* compact: all four lists side by side */
header{padding:10px 16px}header .eyebrow{display:none}h1{font-size:22px;margin:0}
.wrap{max-width:none}
main{padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:16px}.how{font-size:12px;margin:2px 0 0}
.top{margin:6px 0;gap:6px}.count{font-size:14px}
.btn{min-height:28px;padding:3px 9px;font-size:10.5px;letter-spacing:.06em;border-radius:6px}
li{margin-bottom:0}
li label{min-height:28px;padding:3px 4px;gap:7px;border:0;border-radius:6px;box-shadow:none;font-size:14px;line-height:1.2}
li label::before{min-width:1.5em;font-size:12px}
li input{width:17px;height:17px}
li.done label{border:0;background:var(--tint)}
.group{font-size:10.5px;margin:8px 0 2px}
@media print{main{display:block}.panel{border:0;box-shadow:none;padding:0}}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.pick{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pick select{font:inherit;min-height:34px;padding:4px 8px;border-radius:8px;border:1px solid #8A93A8;background:#fff;color:var(--navy)}
@media print{.pick{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the checklist</a>
<header>
  <div class="wrap">
    <p class="eyebrow">BIO 004 lab</p>
    <h1>Module 5 Structure Checklists</h1>
    <div class="pick"><label for="topic">Topic</label><select id="topic"></select></div>
  </div>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
(function(){
  var TOPICS=[{"topic": "Urinary", "lists": [{"id": "u1", "t": "Renal blood flow", "s": ["Renal artery", "Segmental artery", "Interlobar artery", "Arcuate artery", "Cortical radiate artery", "Afferent arteriole", "Glomerulus", "Efferent arteriole", "Peritubular capillaries", "Vasa recta", "Cortical radiate vein", "Arcuate vein", "Interlobar vein", "Renal vein"]}, {"id": "u2", "t": "Nephron", "s": ["Glomerulus", "Glomerular (Bowman’s) capsule, visceral layer (podocytes)", "Capsular space", "Glomerular (Bowman’s) capsule, parietal layer", "Proximal convoluted tubule", "Loop of Henle, descending limb", "Hairpin turn of the loop", "Loop of Henle, ascending limb", "Distal convoluted tubule", "Collecting duct", "Papillary duct"]}, {"id": "u3", "t": "Kidney, outside to ureter", "s": ["Renal capsule", "Renal hilum", "Renal cortex", "Renal medulla", "Renal pyramid", "Renal column", "Renal papilla", "Renal sinus", "Minor calyx", "Major calyx", "Renal pelvis", "Ureter"]}, {"id": "u4", "t": "Renal corpuscle model and bladder", "s": ["Afferent arteriole", "Glomerulus", "Efferent arteriole", "Parietal layer of the glomerular capsule", "Visceral layer of the glomerular capsule (podocytes)", "Capsular space", "Juxtaglomerular apparatus", "Macula densa cells", "Granular (juxtaglomerular) cells", "Ureter", "Urinary bladder", "Ureteral openings", "Trigone", "Detrusor muscle", "Internal urethral orifice", "Internal urethral sphincter", "External urethral sphincter", "Urethra"]}, {"id": "u5", "t": "Urinary system, gross", "s": ["Right kidney", "Left kidney", "Suprarenal (adrenal) gland", "Ureter", "Urinary bladder", "Male urethra", "Female urethra"]}]}, {"topic": "Male reproductive", "lists": [{"id": "m1", "t": "Scrotum, testis and spermatic cord", "s": ["Scrotum", "Dartos muscle", "Cremaster muscle", "Spermatic cord", "Inguinal canal", "Testicular artery", "Testicular vein", "Pampiniform plexus", "Testis", "Tunica vaginalis", "Tunica albuginea", "Seminiferous tubules"]}, {"id": "m2", "t": "Ducts, glands and penis", "s": ["Epididymis", "Vas deferens (ductus deferens)", "Seminal vesicles", "Ejaculatory duct", "Prostate gland", "Prostatic urethra", "Membranous urethra", "Bulbourethral glands", "Spongy (penile) urethra", "Corpus spongiosum", "Corpora cavernosa", "Glans penis", "Prepuce"]}, {"id": "m3", "t": "Testis tissue and sperm cell (slides)", "s": ["Seminiferous tubule", "Sustentacular (Sertoli) cells", "Interstitial (Leydig) cells", "Developing sperm cells", "Head", "Acrosome", "Neck", "Middle piece", "Principal piece", "End piece"]}]}, {"topic": "Female reproductive", "lists": [{"id": "f1", "t": "Ovary, ligaments and uterine tube", "s": ["Ovary", "Ovarian ligament", "Suspensory ligament", "Broad ligament of the uterus", "Round ligament of the uterus", "Ovarian artery", "Ovarian vein", "Fimbriae", "Infundibulum", "Ampulla", "Isthmus"]}, {"id": "f2", "t": "Uterus and vagina", "s": ["Fundus", "Body", "Cervix", "Uterine cavity", "Cervical canal", "Perimetrium", "Myometrium", "Endometrium", "Fornix", "Vagina", "Vaginal orifice"]}, {"id": "f3", "t": "Vulva and pelvic vessels", "s": ["Mons pubis", "Labia majora", "Labia minora", "Clitoris", "Urethral orifice", "Vestibule", "Perineum", "Internal iliac artery", "External iliac artery", "Internal iliac vein", "External iliac vein", "Medial umbilical ligament"]}, {"id": "f4", "t": "Ovary tissue (slide)", "s": ["Ovarian cortex", "Ovarian medulla", "Ovarian follicles", "Mature follicle", "Corpus luteum", "Corpus albicans"]}]}, {"topic": "Brain", "lists": [{"id": "b1", "t": "Cerebrum surface and lobes", "s": ["Gyrus", "Sulcus", "Longitudinal fissure", "Transverse fissure", "Lateral sulcus (Sylvian fissure)", "Central sulcus", "Precentral gyrus", "Precentral sulcus", "Postcentral gyrus", "Postcentral sulcus", "Frontal lobe", "Parietal lobe", "Temporal lobe", "Occipital lobe", "Insula"]}, {"id": "b2", "t": "Midsagittal section", "s": ["Corpus callosum", "Sulcus of the corpus callosum", "Cingulate gyrus", "Cingulate sulcus", "Septum pellucidum", "Fornix", "Thalamus", "Massa intermedia (interthalamic adhesion)", "Hypothalamus", "Infundibulum", "Pineal gland", "Optic chiasm", "Cerebellum", "Transverse fissure"]}, {"id": "b3", "t": "Inferior surface and functional areas", "s": ["Uncus", "Parahippocampal gyrus", "Mammillary bodies", "Crus cerebri", "Optic chiasm", "Optic nerve", "Optic tract", "Olfactory bulb", "Olfactory tract", "Primary motor cortex", "Primary sensory cortex", "Broca’s area", "Wernicke’s area"]}, {"id": "b4", "t": "Cerebral arterial circle (Circle of Willis)", "s": ["Vertebral arteries", "Anterior spinal artery", "Posterior inferior cerebellar artery", "Basilar artery", "Anterior inferior cerebellar artery", "Pontine arteries", "Superior cerebellar artery", "Posterior cerebral artery", "Posterior communicating artery", "Internal carotid artery", "Middle cerebral artery", "Anterior cerebral artery", "Anterior communicating artery"]}]}, {"topic": "Brainstem and cerebellum", "lists": [{"id": "s1", "t": "Brainstem", "s": ["Midbrain", "Cerebral peduncles", "Crus cerebri", "Cerebral aqueduct", "Corpora quadrigemina", "Superior colliculi", "Inferior colliculi", "Pons", "Basilar pons", "Fourth ventricle", "Pontomedullary junction", "Medulla oblongata", "Pyramids", "Decussation of the pyramids", "Medullary olive"]}, {"id": "s2", "t": "Cerebellum and peduncles", "s": ["Cerebellum", "Cerebellar hemispheres", "Vermis", "Folia", "Cerebellar cortex", "Arbor vitae", "Superior cerebellar peduncle", "Middle cerebellar peduncle", "Inferior cerebellar peduncle"]}]}, {"topic": "Meninges, ventricles and CSF", "lists": [{"id": "g1", "t": "Meninges, dural extensions and sinuses", "s": ["Dura mater", "Periosteal layer of the dura", "Meningeal layer of the dura", "Arachnoid mater", "Pia mater", "Falx cerebri", "Falx cerebelli", "Tentorium cerebelli", "Superior sagittal sinus", "Inferior sagittal sinus", "Straight sinus", "Confluence of sinuses", "Transverse sinus", "Sigmoid sinus"]}, {"id": "g2", "t": "Spaces, ventricles and choroid plexus", "s": ["Epidural space", "Subdural space", "Subarachnoid space", "Arachnoid granulations", "Lateral ventricle", "Septum pellucidum", "Interventricular foramen of Monro", "Third ventricle", "Cerebral aqueduct", "Fourth ventricle", "Central canal", "Choroid plexus", "Ependymal cells"]}]}, {"topic": "Spinal cord", "lists": [{"id": "c1", "t": "Spinal meninges and external cord", "s": ["Dura mater", "Arachnoid mater", "Pia mater", "Epidural space", "Subdural space", "Subarachnoid space", "Denticulate ligaments", "Cervical enlargement", "Lumbar enlargement", "Conus medullaris", "Cauda equina", "Filum terminale", "Anterior median fissure", "Posterior median sulcus"]}, {"id": "c2", "t": "Cord in cross section", "s": ["Gray matter", "White matter", "Ventral (anterior) horn", "Lateral horn", "Dorsal (posterior) horn", "Gray commissure", "Central canal", "Anterior white commissure", "Anterior column", "Lateral column", "Posterior column"]}]}, {"topic": "Peripheral nerves and plexuses", "lists": [{"id": "p1", "t": "Spinal nerve, rami and plexuses", "s": ["Ventral (anterior) root", "Dorsal (posterior) root", "Dorsal root ganglion", "Spinal nerve", "Intervertebral foramen", "Ventral (anterior) ramus", "Dorsal (posterior) ramus", "White ramus communicans", "Gray ramus communicans", "Sympathetic chain ganglion", "Sympathetic trunk", "Cervical plexus", "Brachial plexus", "Lumbar plexus", "Sacral plexus", "Phrenic nerve"]}]}, {"topic": "Cranial nerves", "lists": [{"id": "n1", "t": "The twelve cranial nerves", "s": ["CN I, Olfactory", "CN II, Optic", "CN III, Oculomotor", "CN IV, Trochlear", "CN V, Trigeminal", "CN VI, Abducens", "CN VII, Facial", "CN VIII, Vestibulocochlear", "CN IX, Glossopharyngeal", "CN X, Vagus", "CN XI, Accessory", "CN XII, Hypoglossal"]}, {"id": "n2", "t": "Associated structures and eye muscles", "s": ["Olfactory bulb", "Olfactory tract", "Olfactory foramina in the cribriform plate", "Optic nerve", "Optic chiasm", "Optic tract", "Optic canal", "Superior orbital fissure", "Internal acoustic meatus", "Pontomedullary junction", "Lateral rectus", "Medial rectus", "Superior rectus", "Inferior rectus", "Superior oblique", "Inferior oblique"]}]}, {"topic": "Nervous tissue, histology", "lists": [{"id": "h1", "t": "Neuron and neuroglia", "s": ["Cell body (soma)", "Nucleus", "Nucleolus", "Nissl bodies", "Neurofibrils", "Cell processes (dendrites)", "Axon hillock", "Axon", "Synaptic bulb (terminal end)", "Astrocytes", "Oligodendrocytes", "Microglia", "Ependymal cells", "Schwann cells", "Satellite cells"]}, {"id": "h2", "t": "Cortex, cerebellum and nerve (slides)", "s": ["Pyramidal cells", "Gray matter of the cortex", "Underlying white matter", "Purkinje cells", "Cerebellar cortex", "Arbor vitae", "Axon", "Schwann cells", "Nodes of Ranvier", "Endoneurium", "Perineurium", "Fascicle", "Epineurium"]}]}];
  var KEY='m5-checklists-v1',state={topic:0,done:{}};
  try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.done)state=p;}}catch(e){}
  if(!TOPICS[state.topic])state.topic=0;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  var main=document.getElementById('main'),live=document.getElementById('live'),pick=document.getElementById('topic');
  TOPICS.forEach(function(T,i){var o=el('option',null,T.topic);o.value=i;pick.appendChild(o);});
  pick.value=String(state.topic);
  pick.addEventListener('change',function(){state.topic=parseInt(pick.value,10);save();render();});
  function render(){
    main.textContent='';
    TOPICS[state.topic].lists.forEach(function(L,li){
      var panel=el('section','panel');panel.setAttribute('aria-labelledby','h-'+li);
      var hh=el('h2',null,'List '+(li+1)+': '+L.t);hh.id='h-'+li;panel.appendChild(hh);
      var top=el('div','top'),count=el('div','count');top.appendChild(count);
      var all=el('button','btn b-navy','All');all.type='button';all.setAttribute('aria-label','Check all in '+L.t);
      var clr=el('button','btn b-maroon','Clear');clr.type='button';clr.setAttribute('aria-label','Clear '+L.t);
      top.appendChild(all);top.appendChild(clr);panel.appendChild(top);
      var boxes=[],ol=el('ol');
      L.s.forEach(function(name,k){
        var id=L.id+'-'+k,item=el('li'),lab=el('label'),cb=el('input');
        cb.type='checkbox';cb.id=id;cb.checked=!!state.done[id];lab.setAttribute('for',id);
        if(cb.checked)item.className='done';
        cb.addEventListener('change',function(){if(cb.checked)state.done[id]=1;else delete state.done[id];item.className=cb.checked?'done':'';save();upd(true);});
        lab.appendChild(cb);lab.appendChild(el('span',null,name));item.appendChild(lab);ol.appendChild(item);boxes.push([cb,item,id]);
      });
      panel.appendChild(ol);
      function upd(say){var n=boxes.filter(function(x){return x[0].checked;}).length;count.textContent=n+' of '+boxes.length;if(say)live.textContent=L.t+': '+n+' of '+boxes.length+' checked';send();}
      function setAll(v){boxes.forEach(function(x){x[0].checked=v;x[1].className=v?'done':'';if(v)state.done[x[2]]=1;else delete state.done[x[2]];});save();upd(true);}
      all.addEventListener('click',function(){setAll(true);});clr.addEventListener('click',function(){setAll(false);});
      upd(false);main.appendChild(panel);
    });
    send();
  }
  function send(){try{window.parent.postMessage({id:'m5-checklists',type:'resize',height:document.documentElement.scrollHeight},'*');}catch(e){}}
  window.addEventListener('load',send);window.addEventListener('resize',send);
  if(window.ResizeObserver){new ResizeObserver(send).observe(document.body);}
  render();
})();
</script>
</body>
</html>
